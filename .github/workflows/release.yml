name: release

# Two ways in:
#   1. Push a tag `vX.Y.Z` yourself -> GoReleaser publishes it.
#   2. Push to `main` -> the `tag` job computes the next version from commit
#      messages since the last tag, pushes the tag, and GoReleaser runs in this
#      same workflow. (Tags pushed with GITHUB_TOKEN deliberately do not trigger
#      other workflows, so the release must happen here, not via path 1.)
#
# Version bump rules for path 2 (first match wins, scanning commits since last tag):
#   major : subject contains "[major]", or "BREAKING CHANGE", or conventional "type!:"
#   minor : subject contains "[minor]", or starts with "feat"
#   patch : everything else
# Path 2 is skipped when:
#   - HEAD already carries a v* tag (e.g. you pushed main and a tag together)
#   - the HEAD commit subject contains "[skip release]"
#   - every file changed since the last tag is documentation (*.md) or CI (.github/**)

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide next version
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # Skip: HEAD already tagged.
          if existing="$(git tag --points-at HEAD 'v*' | head -n1)" && [ -n "$existing" ]; then
            echo "HEAD already tagged ($existing); skipping auto-tag."
            echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Skip: explicit opt-out.
          if git log -1 --pretty=%s | grep -qiF '[skip release]'; then
            echo "HEAD subject contains [skip release]; skipping auto-tag."
            echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            last_ref="$(git rev-list --max-parents=0 HEAD | tail -n1)"
            major=0; minor=0; patch=0
          else
            last_ref="$last"
            IFS=. read -r major minor patch <<< "${last#v}"
          fi
          echo "Last tag: ${last:-<none>} ($last_ref)"

          # Skip: docs/CI-only changes since last tag.
          changed="$(git diff --name-only "$last_ref"..HEAD)"
          if [ -n "$changed" ] && ! grep -vE '(\.md$|^\.github/)' <<< "$changed" >/dev/null; then
            echo "Only docs/CI changed since $last_ref; skipping auto-tag."
            printf '%s\n' "$changed"
            echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          subjects="$(git log --pretty=%s "$last_ref"..HEAD)"
          bodies="$(git log --pretty=%B "$last_ref"..HEAD)"
          bump=patch
          if grep -qiF '[major]' <<< "$subjects" || grep -qF 'BREAKING CHANGE' <<< "$bodies" || grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$subjects"; then
            bump=major
          elif grep -qiF '[minor]' <<< "$subjects" || grep -qiE '^feat(\(|:|!)' <<< "$subjects"; then
            bump=minor
          fi

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "Bump: $bump -> $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.decide.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.decide.outputs.tag }}" -m "Release ${{ steps.decide.outputs.tag }}"
          git push origin "refs/tags/${{ steps.decide.outputs.tag }}"

  goreleaser:
    needs: [tag]
    # Run for a manual tag push, or when the tag job minted a tag. `always()` lets this
    # job evaluate even though `tag` is skipped on tag-push events.
    if: >-
      always() && (
        github.ref_type == 'tag' ||
        (needs.tag.result == 'success' && needs.tag.outputs.tag != '')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On the auto path, check out the freshly minted tag so GoReleaser sees it at HEAD.
          ref: ${{ github.ref_type == 'tag' && github.ref || needs.tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
